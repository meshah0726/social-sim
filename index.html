<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Status Sim - Celebrity & Social RPG</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-black text-zinc-100 font-sans antialiased selection:bg-pink-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Resilient image generator with seed randomization & multi-tier fallbacks
    const getGenerativeImageUrl = (prompt, width = 600, height = 600) => {
      const sanitized = encodeURIComponent(prompt.trim() || "portrait aesthetic person cinematic");
      const randomSeed = Math.floor(Math.random() * 9999999);
      // Primary Pollinations endpoint with anti-cache query
      return `https://image.pollinations.ai/prompt/${sanitized}?width=${width}&height=${height}&seed=${randomSeed}&nologo=true&model=flux`;
    };

    const INITIAL_NPCS = [
      {
        id: "npc_1",
        name: "Elena Vance",
        handle: "elenavance",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
        category: "fashion",
        verified: true,
        followers: 4850000,
        following: 340,
        bio: "Paris / NYC. Creative Director & Runway. Keep up.",
        relationship: "Verified Icon (Out of Reach)",
        disposition: "cold, high-fashion, dismissive",
        posts: [
          {
            id: "p_elena_1",
            image: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600&auto=format&fit=crop&q=80",
            caption: "Fitting day in Marais. Either wear the piece or don't bother.",
            likes: 182400,
            timestamp: "2h ago",
            comments: [
              { user: "chloeluxe", text: "THAT SILHOUETTE OMG 🔥", likes: 341 },
              { user: "marcus_k", text: "Insane fit", likes: 88 }
            ]
          }
        ]
      },
      {
        id: "npc_2",
        name: "Jaxson Cole",
        handle: "jaxsoncole",
        avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80",
        category: "musicians",
        verified: true,
        followers: 1240000,
        following: 512,
        bio: "sample chops & 70s soul basslines. debut album soon. 🎹",
        relationship: "Industry Celebrity",
        disposition: "chill, musical genius, late-night replies",
        posts: [
          {
            id: "p_jax_1",
            image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80",
            caption: "been in the lab for 14 hours straight. 2am Rhodes chords hit different.",
            likes: 42100,
            timestamp: "4h ago",
            comments: [
              { user: "beatmaker_sam", text: "drop the snippet bro stop gatekeeping", likes: 212 },
              { user: "vibecheck_daily", text: "unreal setup", likes: 45 }
            ]
          }
        ]
      },
      {
        id: "npc_3",
        name: "Trey Jenkins",
        handle: "trey_iron",
        avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80",
        category: "gym",
        verified: false,
        followers: 18200,
        following: 420,
        bio: "Heavy compounds & meal prep. Stop overthinking progressive overload.",
        relationship: "Gym Bro / Mutual",
        disposition: "hype, honest, direct, zero filter",
        posts: [
          {
            id: "p_trey_1",
            image: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=600&auto=format&fit=crop&q=80",
            caption: "495lb rack pull moved like butter. If you're skipping heavy days don't talk to me.",
            likes: 1204,
            timestamp: "7h ago",
            comments: [
              { user: "kyle_pulls", text: "form was clean too damn", likes: 19 },
              { user: "gymcritic99", text: "hitch at the knees tbh", likes: 4 }
            ]
          }
        ]
      }
    ];

    const generateDemographicMutuals = (schoolOrWork) => {
      const workplace = schoolOrWork || "Campus / Local";
      return [
        {
          id: "npc_mut_1",
          name: "Maya Chen",
          handle: "mayac",
          avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80",
          category: "mutual",
          verified: false,
          followers: 432,
          following: 410,
          bio: `hanging out around ${workplace} ☕ film cameras & iced lattes`,
          relationship: "Close Friend / Mutual",
          mutualBadge: `Attends ${workplace}`,
          disposition: "warm, sarcastic, inside jokes",
          posts: []
        },
        {
          id: "npc_mut_2",
          name: "Alex Rivera",
          handle: "alexrivers",
          avatar: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80",
          category: "mutual",
          verified: false,
          followers: 612,
          following: 580,
          bio: `coffee addict at ${workplace}. someone please fix my sleep schedule`,
          relationship: "Friend / Classmate",
          mutualBadge: `Mutual friend with Maya + 3 others`,
          disposition: "casual, goofy, always online",
          posts: []
        },
        {
          id: "npc_mut_3",
          name: "Jordan Hayes",
          handle: "jhayes_99",
          avatar: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150&auto=format&fit=crop&q=80",
          category: "mutual",
          verified: false,
          followers: 890,
          following: 640,
          bio: "weekend runner | thrifting | photography",
          relationship: "Situationship / Complicated",
          mutualBadge: `Works / Studies near ${workplace}`,
          disposition: "playful, mysterious, leaves ambiguous comments",
          posts: []
        }
      ];
    };

    function App() {
      const [saves, setSaves] = useState(() => {
        const saved = localStorage.getItem("status_sim_multi_saves");
        return saved ? JSON.parse(saved) : {
          "slot_1": {
            name: "Main Career",
            created: new Date().toLocaleDateString(),
            gameState: null
          }
        };
      });
      const [activeSlot, setActiveSlot] = useState("slot_1");

      const [player, setPlayer] = useState(null);
      const [feed, setFeed] = useState([]);
      const [npcs, setNpcs] = useState([]);
      const [suggestedFollows, setSuggestedFollows] = useState([]);
      const [dms, setDms] = useState({});
      const [activeDmUser, setActiveDmUser] = useState(null);
      const [activeTab, setActiveTab] = useState("feed");

      // Onboarding State
      const [onboardingStep, setOnboardingStep] = useState(1);
      const [formName, setFormName] = useState("");
      const [formHandle, setFormHandle] = useState("");
      const [formBio, setFormBio] = useState("");
      const [formAge, setFormAge] = useState("20");
      const [formSchoolWork, setFormSchoolWork] = useState("Ohio State");
      const [formAspirations, setFormAspirations] = useState("Aspiring Creative & Music Producer");
      const [avatarMethod, setAvatarMethod] = useState("ai");
      const [avatarPrompt, setAvatarPrompt] = useState("vintage aesthetic 20yo person film photography");
      const [avatarUrl, setAvatarUrl] = useState("");
      const [isGeneratingAvatar, setIsGeneratingAvatar] = useState(false);

      // Post Creation
      const [postMethod, setPostMethod] = useState("ai");
      const [postAiPrompt, setPostAiPrompt] = useState("");
      const [postImageUrl, setPostImageUrl] = useState("");
      const [postCaption, setPostCaption] = useState("");
      const [postVibe, setPostVibe] = useState("Aesthetic Dump");
      const [isGeneratingPostImg, setIsGeneratingPostImg] = useState(false);

      // DM Engine & OpenRouter
      const [dmMessage, setDmMessage] = useState("");
      const [isSendingDm, setIsSendingDm] = useState(false);
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("status_sim_openrouter_key") || "");
      const [showSettings, setShowSettings] = useState(false);

      // Sync active save slot
      useEffect(() => {
        if (player) {
          const updatedSaves = {
            ...saves,
            [activeSlot]: {
              ...saves[activeSlot],
              gameState: { player, feed, npcs, suggestedFollows, dms }
            }
          };
          setSaves(updatedSaves);
          localStorage.setItem("status_sim_multi_saves", JSON.stringify(updatedSaves));
        }
      }, [player, feed, npcs, dms]);

      // Load active slot data
      useEffect(() => {
        const slotData = saves[activeSlot];
        if (slotData && slotData.gameState) {
          setPlayer(slotData.gameState.player);
          setFeed(slotData.gameState.feed);
          setNpcs(slotData.gameState.npcs);
          setSuggestedFollows(slotData.gameState.suggestedFollows || []);
          setDms(slotData.gameState.dms || {});
        } else {
          setPlayer(null);
        }
      }, [activeSlot]);

      const handleSaveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem("status_sim_openrouter_key", key);
        alert("API Key saved securely to your browser!");
      };

      // Resilient Avatar Fetch
      const handleGenerateAiAvatar = () => {
        setIsGeneratingAvatar(true);
        const url = getGenerativeImageUrl(avatarPrompt, 500, 500);
        const img = new Image();
        img.src = url;
        img.onload = () => {
          setAvatarUrl(url);
          setIsGeneratingAvatar(false);
        };
        img.onerror = () => {
          // Fallback to random unsplash avatar if external network blocks
          const fallback = `https://images.unsplash.com/photo-${1534528741775 + Math.floor(Math.random() * 50)}?w=400&auto=format&fit=crop&q=80`;
          setAvatarUrl(fallback);
          setIsGeneratingAvatar(false);
        };
      };

      const handleFileUpload = (e, targetSetter) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => targetSetter(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleCompleteOnboarding = () => {
        const finalAvatar = avatarUrl || getGenerativeImageUrl("young creative person aesthetic");
        const newPlayer = {
          name: formName || "Jordan Rivers",
          handle: (formHandle || "jordanrivers").toLowerCase().replace(/[^a-z0-9_]/g, ""),
          avatar: finalAvatar,
          bio: formBio || "making memories & staying lowkey ✨",
          age: formAge,
          schoolWork: formSchoolWork || "Campus",
          aspirations: formAspirations || "Creative",
          publicLore: `New face around ${formSchoolWork || 'town'}. Zero clout, just getting started.`,
          followers: 0,
          following: 0,
          fameScore: 0,
          posts: []
        };

        const demMutuals = generateDemographicMutuals(formSchoolWork);
        const fullNpcPool = [...INITIAL_NPCS, ...demMutuals];
        
        const starterFeed = [];
        fullNpcPool.forEach(n => {
          if (n.posts && n.posts.length > 0) {
            n.posts.forEach(p => starterFeed.push({ ...p, author: n }));
          }
        });

        setPlayer(newPlayer);
        setNpcs(fullNpcPool);
        setSuggestedFollows(demMutuals);
        setFeed(starterFeed);
        setOnboardingStep(3);
      };

      const handleFollow = (targetNpc) => {
        const isFollowing = player.followingList?.includes(targetNpc.id);
        const updatedFollowing = isFollowing 
          ? player.followingList.filter(id => id !== targetNpc.id)
          : [...(player.followingList || []), targetNpc.id];

        setPlayer(prev => ({
          ...prev,
          following: updatedFollowing.length,
          followingList: updatedFollowing
        }));

        if (!isFollowing && targetNpc.category === "mutual" && Math.random() > 0.3) {
          setTimeout(() => {
            setPlayer(prev => ({ ...prev, followers: prev.followers + 1 }));
            const introMsg = {
              id: "dm_" + Date.now(),
              sender: "npc",
              text: `saw you made an account! how is ${player.schoolWork} going?`,
              timestamp: "Just now"
            };
            setDms(prev => ({
              ...prev,
              [targetNpc.handle]: [...(prev[targetNpc.handle] || []), introMsg]
            }));
          }, 2500);
        }
      };

      // Resilient Post Image Generation
      const handleGeneratePostImage = () => {
        setIsGeneratingPostImg(true);
        const url = getGenerativeImageUrl(postAiPrompt || "film camera aesthetic photo instagram post", 700, 700);
        const img = new Image();
        img.src = url;
        img.onload = () => {
          setPostImageUrl(url);
          setIsGeneratingPostImg(false);
        };
        img.onerror = () => {
          setPostImageUrl("https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80");
          setIsGeneratingPostImg(false);
        };
      };

      const handleCreatePost = () => {
        const finalImg = postImageUrl || getGenerativeImageUrl(postAiPrompt || "aesthetic moment", 700, 700);
        const currentFollowers = player.followers;
        let viralRoll = Math.random();
        if (postVibe === "Unfiltered Rant" || postVibe === "Hot Take (Risky / Viral)") viralRoll += 0.25;

        const isViral = viralRoll > 0.85;
        let gainedFollowers = 0;
        let generatedLikes = 0;

        if (currentFollowers < 150) {
          generatedLikes = Math.floor(Math.random() * (currentFollowers + 1) * 0.7) + 2;
          gainedFollowers = isViral ? Math.floor(Math.random() * 80) + 15 : Math.floor(Math.random() * 3);
        } else if (currentFollowers < 2500) {
          generatedLikes = Math.floor(currentFollowers * (0.15 + Math.random() * 0.25));
          gainedFollowers = isViral ? Math.floor(Math.random() * 450) + 80 : Math.floor(Math.random() * 12);
        } else {
          generatedLikes = Math.floor(currentFollowers * (0.08 + Math.random() * 0.2));
          gainedFollowers = isViral ? Math.floor(Math.random() * 3000) + 500 : Math.floor(Math.random() * 50);
        }

        const generatedComments = [];
        if (currentFollowers < 150 && !isViral) {
          generatedComments.push(
            { user: "mayac", text: "okkk fit check?? where was my invite", likes: 2 },
            { user: "alexrivers", text: "hard 🔥", likes: 1 }
          );
        } else if (isViral) {
          generatedComments.push(
            { user: "random_lurker_42", text: "why is this on my explore page lmao", likes: 142 },
            { user: "trey_iron", text: "actually valid ngl", likes: 89 },
            { user: "hater_patrol", text: "bro thought he did something here 💀", likes: 34 }
          );
        } else {
          generatedComments.push(
            { user: "alexrivers", text: "bro is glowing up", likes: 8 },
            { user: "mayac", text: "drop the location right now", likes: 5 }
          );
        }

        const newPost = {
          id: "p_u_" + Date.now(),
          image: finalImg,
          caption: postCaption,
          likes: generatedLikes,
          vibe: postVibe,
          timestamp: "Just now",
          comments: generatedComments,
          author: {
            name: player.name,
            handle: player.handle,
            avatar: player.avatar,
            verified: player.fameScore > 50000
          }
        };

        let updatedLore = player.publicLore;
        if (isViral) {
          updatedLore = `Trending after a viral ${postVibe.toLowerCase()} post. Strangers in the comments are debating their vibe.`;
        } else if (player.posts.length > 2) {
          updatedLore = `Actively building presence around ${player.aspirations}. Consistent engagement.`;
        }

        setPlayer(prev => ({
          ...prev,
          followers: prev.followers + gainedFollowers,
          fameScore: prev.fameScore + (isViral ? 200 : 25),
          publicLore: updatedLore,
          posts: [newPost, ...prev.posts]
        }));

        setFeed(prev => [newPost, ...prev]);
        setPostCaption("");
        setPostImageUrl("");
        setPostAiPrompt("");
        setActiveTab("feed");
      };

      // OpenRouter or Heuristic DM Handler
      const handleSendDm = async (targetNpc) => {
        if (!dmMessage.trim() || isSendingDm) return;

        const userMsgText = dmMessage;
        const userMsg = {
          id: "dm_u_" + Date.now(),
          sender: "user",
          text: userMsgText,
          timestamp: "Just now"
        };

        const updatedHistory = [...(dms[targetNpc.handle] || []), userMsg];
        setDms(prev => ({ ...prev, [targetNpc.handle]: updatedHistory }));
        setDmMessage("");
        setIsSendingDm(true);

        // If OpenRouter API Key is supplied, call free LLM endpoint
        if (apiKey.trim()) {
          try {
            const systemPrompt = `You are ${targetNpc.name} (@${targetNpc.handle}) in an Instagram/social simulator. Your bio: "${targetNpc.bio}". Your relationship to the player: "${targetNpc.relationship}". Your personality: "${targetNpc.disposition}". You are texting back via Instagram DMs. Keep your response casual, authentic, realistic to internet texting, under 25 words. Do not break character.`;

            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${apiKey.trim()}`,
                "Content-Type": "application/json",
                "HTTP-Referer": window.location.origin,
                "X-Title": "Status Sim"
              },
              body: JSON.stringify({
                model: "meta-llama/llama-3.3-70b-instruct:free",
                messages: [
                  { role: "system", content: systemPrompt },
                  { role: "user", content: userMsgText }
                ]
              })
            });

            if (res.ok) {
              const data = await res.json();
              const reply = data.choices[0]?.message?.content?.trim();
              if (reply) {
                setDms(prev => ({
                  ...prev,
                  [targetNpc.handle]: [...(prev[targetNpc.handle] || []), {
                    id: "dm_npc_" + Date.now(),
                    sender: "npc",
                    text: reply,
                    timestamp: "Just now"
                  }]
                }));
                setIsSendingDm(false);
                return;
              }
            }
          } catch (e) {
            console.warn("OpenRouter fetch error, falling back to heuristic engine.");
          }
        }

        // Offline Heuristic Engine Fallback
        setTimeout(() => {
          let replyText = "Seen";
          if (targetNpc.verified && player.followers < 10000) {
            setIsSendingDm(false);
            return; // Out of reach celebs don't reply
          }

          if (targetNpc.category === "mutual") {
            const pool = ["hahaha no way", "lmao are you fr?", "we need to link up soon", "dude literally 😭", "nah that's crazy"];
            replyText = pool[Math.floor(Math.random() * pool.length)];
          } else if (targetNpc.category === "gym") {
            replyText = "Heavy sets cure everything bro. Lock in.";
          } else {
            replyText = "appreciate the support! keep creating ⚡";
          }

          setDms(prev => ({
            ...prev,
            [targetNpc.handle]: [...(prev[targetNpc.handle] || []), {
              id: "dm_npc_" + Date.now(),
              sender: "npc",
              text: replyText,
              timestamp: "Just now"
            }]
          }));
          setIsSendingDm(false);
        }, 1000);
      };

      const handleCreateNewSlot = () => {
        const slotKey = "slot_" + Date.now();
        const slotTitle = prompt("Enter a name for this save slot:") || "New Arc";
        const newSaves = {
          ...saves,
          [slotKey]: {
            name: slotTitle,
            created: new Date().toLocaleDateString(),
            gameState: null
          }
        };
        setSaves(newSaves);
        setActiveSlot(slotKey);
        localStorage.setItem("status_sim_multi_saves", JSON.stringify(newSaves));
      };

      const handleExportSave = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(saves));
        const a = document.createElement("a");
        a.href = dataStr;
        a.download = `status_sim_backup_${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      const handleImportSave = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              setSaves(imported);
              setActiveSlot(Object.keys(imported)[0]);
              localStorage.setItem("status_sim_multi_saves", JSON.stringify(imported));
              alert("Save file imported!");
            } catch (err) {
              alert("Invalid JSON file.");
            }
          };
          reader.readAsText(file);
        }
      };

      // ==========================================
      // ONBOARDING VIEW
      // ==========================================
      if (!player) {
        return (
          <div className="min-h-screen bg-zinc-950 flex flex-col justify-center items-center p-4">
            <div className="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl space-y-6">
              
              <div className="text-center space-y-1">
                <span className="text-xs font-bold tracking-widest text-pink-500 uppercase">Status RPG</span>
                <h1 className="text-2xl font-black tracking-tight text-white">Create Your Social Persona</h1>
                <p className="text-xs text-zinc-400">Start with 0 followers. Shape your rep with every move.</p>
              </div>

              {onboardingStep === 1 && (
                <div className="space-y-4">
                  <div>
                    <label className="text-xs font-medium text-zinc-300">Display Name</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Jordan Rivers"
                      value={formName}
                      onChange={e => setFormName(e.target.value)}
                      className="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-pink-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-medium text-zinc-300">Username (@handle)</label>
                    <div className="flex items-center mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3">
                      <span className="text-zinc-500 text-sm">@</span>
                      <input 
                        type="text" 
                        placeholder="jordanrivers"
                        value={formHandle}
                        onChange={e => setFormHandle(e.target.value)}
                        className="w-full bg-transparent p-2.5 text-sm text-white focus:outline-none"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-medium text-zinc-300">Age</label>
                      <input 
                        type="number" 
                        value={formAge}
                        onChange={e => setFormAge(e.target.value)}
                        className="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-pink-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-medium text-zinc-300">School / Workplace</label>
                      <input 
                        type="text" 
                        placeholder="e.g. Ohio State, Gym"
                        value={formSchoolWork}
                        onChange={e => setFormSchoolWork(e.target.value)}
                        className="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-pink-500"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-medium text-zinc-300">Bio</label>
                    <textarea 
                      placeholder="e.g. sample flips & late night tempo runs 📻"
                      value={formBio}
                      onChange={e => setFormBio(e.target.value)}
                      className="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-pink-500 h-20 resize-none"
                    />
                  </div>
                  <button 
                    onClick={() => setOnboardingStep(2)}

              {activeTab === "profile" && (
                <div className="p-4 space-y-5">
                  <div className="flex items-center justify-between">
                    <img src={player.avatar} className="w-20 h-20 rounded-full object-cover border-2 border-pink-500 p-0.5" />
                    <div className="flex gap-6 text-center">
                      <div>
                        <div className="text-sm font-bold text-white">{player.posts.length}</div>
                        <div className="text-[10px] text-zinc-400">Posts</div>
                      </div>
                      <div>
                        <div className="text-sm font-bold text-white">{player.followers.toLocaleString()}</div>
                        <div className="text-[10px] text-zinc-400">Followers</div>
                      </div>
                      <div>
                        <div className="text-sm font-bold text-white">{player.following.toLocaleString()}</div>
                        <div className="text-[10px] text-zinc-400">Following</div>
                      </div>
                    </div>
                  </div>

                  <div>
                    <h2 className="text-sm font-bold text-white flex items-center gap-1">
                      {player.name}
                      {player.fameScore > 50000 && <span className="text-blue-400 text-xs">✓</span>}
                    </h2>
                    <div className="text-xs text-zinc-500 font-mono">@{player.handle}</div>
                    <p className="text-xs text-zinc-300 mt-1.5 whitespace-pre-line">{player.bio}</p>
                    <div className="text-[11px] text-pink-400 mt-1 font-medium">📍 {player.schoolWork} • {player.age} y/o</div>
                  </div>

                  <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-3.5 space-y-1.5">
                    <div className="flex justify-between items-center">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-pink-500">Public Lore & Reputation</span>
                      <span className="text-[10px] font-mono text-zinc-500">Fame: {player.fameScore}</span>
                    </div>
                    <p className="text-xs text-zinc-300 leading-relaxed">{player.publicLore}</p>
                    <div className="text-[10px] text-zinc-500 pt-1 border-t border-zinc-800">
                      Stated Goal: <span className="text-zinc-400 font-medium">{player.aspirations}</span>
                    </div>
                  </div>

                  <div>
                    <div className="text-xs font-bold uppercase tracking-wider text-zinc-400 border-b border-zinc-800 pb-2 mb-2">Your Posts</div>
                    {player.posts.length === 0 ? (
                      <div className="text-center py-10 text-zinc-500 text-xs">No photos posted yet.</div>
                    ) : (
                      <div className="grid grid-cols-3 gap-1">
                        {player.posts.map(p => (
                          <div key={p.id} className="aspect-square bg-zinc-900">
                            <img src={p.image} className="w-full h-full object-cover" />
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

            </main>

            {/* BOTTOM NAV */}
            <nav className="fixed bottom-0 max-w-md w-full bg-zinc-950/95 backdrop-blur-md border-t border-zinc-800/80 px-6 py-3 flex items-center justify-between z-40">
              <button onClick={() => setActiveTab("feed")} className={`flex flex-col items-center ${activeTab === 'feed' ? 'text-pink-500' : 'text-zinc-500'}`}>
                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
              </button>

              <button onClick={() => setOnboardingStep(3)} className="flex flex-col items-center text-zinc-500 hover:text-white">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
              </button>

              <button onClick={() => setActiveTab("create")} className="flex items-center justify-center w-10 h-10 rounded-full bg-pink-600 hover:bg-pink-500 text-white shadow-lg shadow-pink-600/30">
                <span className="text-xl font-bold leading-none mb-0.5">+</span>
              </button>

              <button onClick={() => { setActiveDmUser(null); setActiveTab("dms"); }} className={`flex flex-col items-center ${activeTab === 'dms' ? 'text-pink-500' : 'text-zinc-500'}`}>
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
              </button>

              <button onClick={() => setActiveTab("profile")} className={`flex flex-col items-center ${activeTab === 'profile' ? 'text-pink-500' : 'text-zinc-500'}`}>
                <img src={player.avatar} className={`w-6 h-6 rounded-full object-cover border ${activeTab === 'profile' ? 'border-pink-500' : 'border-zinc-700'}`} />
              </button>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
