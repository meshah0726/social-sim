    };

    const generateDemographicMutuals = (schoolOrWork) => {
      const workplace = schoolOrWork || "Campus / Local";
      return [
        {

          category: "mutual",
          verified: false,
          followers: 432,
          following: 410,
          bio: `hanging around ${workplace} ☕ film & iced lattes`,
          relationship: "Close Friend / Mutual",
          mutualBadge: `Attends ${workplace}`,
          disposition: "warm, sarcastic, inside jokes",
          posts: [
            {
              id: "p_maya_1",
              image: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=600&auto=format&fit=crop&q=80",

          ]

        {

          relationship: "Friend / Classmate",
          mutualBadge: `Mutual friend with Maya + 3 others`,
          disposition: "casual, goofy, always online",

            {

    };

    function App() {
      // Key Pool State
      const [apiKeys, setApiKeys] = useState(() => {
        const saved = localStorage.getItem("status_sim_keys_pool");
        return saved ? JSON.parse(saved) : [];
      });
      const [newKeyInput, setNewKeyInput] = useState("");
      const [aiStatusMessage, setAiStatusMessage] = useState("");

      // Save Slots
      const [saves, setSaves] = useState(() => {
        const saved = localStorage.getItem("status_sim_multi_saves");
        return saved ? JSON.parse(saved) : {
          "slot_1": { name: "Main Career", created: new Date().toLocaleDateString(), gameState: null }
        };
      });
      const [activeSlot, setActiveSlot] = useState("slot_1");

      // Game Data
      const [player, setPlayer] = useState(null);
      const [feed, setFeed] = useState([]);
      const [npcs, setNpcs] = useState([]);
      const [suggestedFollows, setSuggestedFollows] = useState([]);
      const [dms, setDms] = useState({});
      const [activeDmUser, setActiveDmUser] = useState(null);
      const [activeTab, setActiveTab] = useState("feed");

      // Inspection Navigation
      const [inspectedUser, setInspectedUser] = useState(null);
      const [inspectedPost, setInspectedPost] = useState(null);
      const [postCommentInput, setPostCommentInput] = useState("");

      // Onboarding
      const [onboardingStep, setOnboardingStep] = useState(1);
      const [formName, setFormName] = useState("");
      const [formHandle, setFormHandle] = useState("");
      const [formBio, setFormBio] = useState("");
      const [formAge, setFormAge] = useState("20");
      const [formSchoolWork, setFormSchoolWork] = useState("Ohio State");
      const [formAspirations, setFormAspirations] = useState("Aspiring Creative");
      const [avatarMethod, setAvatarMethod] = useState("ai");
      const [avatarPrompt, setAvatarPrompt] = useState("20yo college guy film photography portrait aesthetic");
      const [avatarUrl, setAvatarUrl] = useState("");
      const [isGeneratingAvatar, setIsGeneratingAvatar] = useState(false);

      // Post Creation
      const [postMethod, setPostMethod] = useState("ai");
      const [postAiPrompt, setPostAiPrompt] = useState("");
      const [postImageUrl, setPostImageUrl] = useState("");
      const [postCaption, setPostCaption] = useState("");
      const [postVibe, setPostVibe] = useState("Aesthetic Dump");
      const [isGeneratingPostImg, setIsGeneratingPostImg] = useState(false);

      // DM State
      const [dmMessage, setDmMessage] = useState("");
      const [isSendingDm, setIsSendingDm] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [isGeneratingNpcs, setIsGeneratingNpcs] = useState(false);

      // Sync active save
      useEffect(() => {
        if (player) {
          const updatedSaves = {
            ...saves,
            [activeSlot]: {
              ...saves[activeSlot],
              gameState: { player, feed, npcs, suggestedFollows, dms }
            }
          };
          setSaves(updatedSaves);
          localStorage.setItem("status_sim_multi_saves", JSON.stringify(updatedSaves));
        }
      }, [player, feed, npcs, dms]);

      // Load active slot
      useEffect(() => {
        const slotData = saves[activeSlot];
        if (slotData && slotData.gameState) {
          setPlayer(slotData.gameState.player);
          setFeed(slotData.gameState.feed);
          setNpcs(slotData.gameState.npcs);
          setSuggestedFollows(slotData.gameState.suggestedFollows || []);
          setDms(slotData.gameState.dms || {});
        } else {
          setPlayer(null);
        }
      }, [activeSlot]);

      // Add a single key to pool
      const handleAddKey = () => {
        const trimmed = newKeyInput.trim();
        if (!trimmed) return;
        if (apiKeys.includes(trimmed)) {
          alert("Key already added!");
          return;
        }
        const updated = [...apiKeys, trimmed];
        setApiKeys(updated);
        localStorage.setItem("status_sim_keys_pool", JSON.stringify(updated));
        setNewKeyInput("");
      };

      const handleRemoveKey = (index) => {
        const updated = apiKeys.filter((_, idx) => idx !== index);
        setApiKeys(updated);
        localStorage.setItem("status_sim_keys_pool", JSON.stringify(updated));
      };

      const handleGenerateAiAvatar = () => {
        setIsGeneratingAvatar(true);
        const url = getGenerativeImageUrl(avatarPrompt, 500, 500);
        const img = new Image();
        img.src = url;
        img.onload = () => {
          setAvatarUrl(url);
          setIsGeneratingAvatar(false);
        };
        img.onerror = () => {
          setAvatarUrl(`https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80`);
          setIsGeneratingAvatar(false);
        };
      };

      const handleFileUpload = (e, targetSetter) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => targetSetter(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleCompleteOnboarding = () => {
        const finalAvatar = avatarUrl || getGenerativeImageUrl("young creative person aesthetic");
        const newPlayer = {
          name: formName || "Jordan Rivers",
          handle: (formHandle || "jordanrivers").toLowerCase().replace(/[^a-z0-9_]/g, ""),
          avatar: finalAvatar,
          bio: formBio || "making memories & staying lowkey ✨",
          age: formAge,
          schoolWork: formSchoolWork || "Campus",
          aspirations: formAspirations || "Creative",
          publicLore: `New face around ${formSchoolWork || 'town'}. Zero clout, just getting started.`,
          followers: 0,
          following: 0,
          followingList: [],
          fameScore: 0,
          posts: []
        };

        const demMutuals = generateDemographicMutuals(formSchoolWork);
        const fullNpcPool = [...INITIAL_NPCS, ...demMutuals];
        
        const starterFeed = [];
        fullNpcPool.forEach(n => {
          if (n.posts && n.posts.length > 0) {
            n.posts.forEach(p => starterFeed.push({ ...p, author: n }));
          }
        });

        setPlayer(newPlayer);
        setNpcs(fullNpcPool);
        setSuggestedFollows(demMutuals);
        setFeed(starterFeed);
        setOnboardingStep(3);
      };

      const handleFollow = (targetNpc) => {
        const isFollowing = player.followingList?.includes(targetNpc.id);
        const updatedFollowing = isFollowing 
          ? player.followingList.filter(id => id !== targetNpc.id)
          : [...(player.followingList || []), targetNpc.id];

        setPlayer(prev => ({
          ...prev,
          following: updatedFollowing.length,
          followingList: updatedFollowing
        }));

        if (!isFollowing && targetNpc.category === "mutual" && Math.random() > 0.3) {
          setTimeout(() => {
            setPlayer(prev => ({ ...prev, followers: prev.followers + 1 }));
            const introMsg = {
              id: "dm_" + Date.now(),
              sender: "npc",
              text: `saw you made an account! how's ${player.schoolWork} going?`,
              timestamp: "Just now"
            };
            setDms(prev => ({
              ...prev,
              [targetNpc.handle]: [...(prev[targetNpc.handle] || []), introMsg]
            }));
          }, 2500);
        }
      };

      // Like / Unlike any post
      const handleToggleLike = (post) => {
        const isLiked = post.likedByPlayer;
        const delta = isLiked ? -1 : 1;

        // Update in feed
        setFeed(prev => prev.map(p => p.id === post.id ? { ...p, likes: p.likes + delta, likedByPlayer: !isLiked } : p));
        
        // Update in NPCs catalog if belonging to NPC
        setNpcs(prev => prev.map(npc => ({
          ...npc,
          posts: npc.posts.map(p => p.id === post.id ? { ...p, likes: p.likes + delta, likedByPlayer: !isLiked } : p)
        })));

        // If inspecting post
        if (inspectedPost && inspectedPost.id === post.id) {
          setInspectedPost(prev => ({ ...prev, likes: prev.likes + delta, likedByPlayer: !isLiked }));
        }
      };

      // Add a comment to an NPC or player post
      const handleAddComment = (post) => {
        if (!postCommentInput.trim()) return;

        const newComment = {
          id: "cmt_" + Date.now(),
          user: player.handle,
          text: postCommentInput.trim(),
          likes: 0
        };

        const updateComments = (postsList) =>
          postsList.map(p => p.id === post.id ? { ...p, comments: [...(p.comments || []), newComment] } : p);

        setFeed(prev => updateComments(prev));
        setNpcs(prev => prev.map(npc => ({ ...npc, posts: updateComments(npc.posts) })));
        if (inspectedPost && inspectedPost.id === post.id) {
          setInspectedPost(prev => ({ ...prev, comments: [...(prev.comments || []), newComment] }));
        }

        setPostCommentInput("");

        // NPC reacts or replies to comment after a delay
        setTimeout(() => {
          const npcAuthor = npcs.find(n => n.handle === post.author.handle);
          if (npcAuthor && npcAuthor.category === "mutual") {
            const replies = ["appreciate you! 🔥", "haha fr", "🙌🙌", "we need to link up soon!"];
            const npcReply = {
              id: "cmt_rep_" + Date.now(),
              user: npcAuthor.handle,
              text: replies[Math.floor(Math.random() * replies.length)],
              likes: 1
            };
            setFeed(prev => prev.map(p => p.id === post.id ? { ...p, comments: [...(p.comments || []), npcReply] } : p));
            setNpcs(prev => prev.map(npc => npc.handle === npcAuthor.handle ? {
              ...npc,
              posts: npc.posts.map(p => p.id === post.id ? { ...p, comments: [...(p.comments || []), npcReply] } : p)
            } : npc));
            if (inspectedPost && inspectedPost.id === post.id) {
              setInspectedPost(prev => ({ ...prev, comments: [...(prev.comments || []), npcReply] }));
            }
          }
        }, 1800);
      };

      // Generate New AI Characters On Demand
      const handleGenerateMoreAiNpcs = async () => {
        setIsGeneratingNpcs(true);
        setAiStatusMessage("Spawning new personas via AI...");

        let generatedProfiles = null;

        if (apiKeys.length > 0) {
          for (const key of apiKeys) {
            try {
              const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${key.trim()}`,
                  "Content-Type": "application/json",
                  "HTTP-Referer": window.location.origin,
                  "X-Title": "Status Sim"
                },
                body: JSON.stringify({
                  model: "openrouter/free",
                  messages: [
                    {
                      role: "system",
                      content: `Generate 2 realistic social profiles for peers near ${player.schoolWork}. Return ONLY valid JSON array with keys: name, handle, bio, disposition, relationship, photo_prompt. No markdown formatting, just raw JSON.`
                    }
                  ]
                })
              });

              if (res.ok) {
                const data = await res.json();
                const content = data.choices[0]?.message?.content;
                const clean = content.replace(/```json/g, '').replace(/```/g, '').trim();
                generatedProfiles = JSON.parse(clean);
                break;
              }
            } catch (err) {
              console.warn("Key error on generation, trying next...");
            }
          }
        }

        if (!generatedProfiles || !Array.isArray(generatedProfiles)) {
          const names = ["Marcus Bell", "Chloe Bennett", "Kai Thorne", "Zoe Vance"];
          const picked = names[Math.floor(Math.random() * names.length)];
          generatedProfiles = [
            {
              name: picked,
              handle: picked.toLowerCase().replace(" ", "_"),
              bio: `local around ${player.schoolWork} | late night photography`,
              disposition: "chill, artistic, dry humor",
              relationship: "Mutual Acquaintance",
              photo_prompt: "young aesthetic college student portrait film 35mm"
            }
          ];
        }

        const formatted = generatedProfiles.map((p, idx) => ({
          id: "npc_gen_" + Date.now() + "_" + idx,
          name: p.name,
          handle: p.handle.toLowerCase().replace(/[^a-z0-9_]/g, ""),
          avatar: getGenerativeImageUrl(p.photo_prompt || "portrait aesthetic person", 300, 300),
          category: "mutual",
          verified: false,
          followers: Math.floor(Math.random() * 800) + 200,
          following: Math.floor(Math.random() * 600) + 150,
          bio: p.bio,
          relationship: p.relationship || "Suggested Connection",
          mutualBadge: `Around ${player.schoolWork}`,
          disposition: p.disposition,
          posts: [
            {
              id: "p_gen_" + Date.now() + "_" + idx,
              image: getGenerativeImageUrl("film photography aesthetic portrait", 600, 600),
              caption: "new camera test 🎞️",
              likes: Math.floor(Math.random() * 80) + 20,
              likedByPlayer: false,
              timestamp: "1h ago",
              comments: []
            }
          ]
        }));

        setNpcs(prev => [...formatted, ...prev]);
        setSuggestedFollows(prev => [...formatted, ...prev]);
        setIsGeneratingNpcs(false);
        setAiStatusMessage("New profiles generated!");
        setTimeout(() => setAiStatusMessage(""), 3000);
      };

      const handleGeneratePostImage = () => {
        setIsGeneratingPostImg(true);
        const url = getGenerativeImageUrl(postAiPrompt || "film camera aesthetic photo instagram post", 700, 700);
        const img = new Image();
        img.src = url;
        img.onload = () => {
          setPostImageUrl(url);
          setIsGeneratingPostImg(false);
        };
        img.onerror = () => {
          setPostImageUrl("https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80");
          setIsGeneratingPostImg(false);
        };
      };

      const handleCreatePost = () => {
        const finalImg = postImageUrl || getGenerativeImageUrl(postAiPrompt || "aesthetic moment", 700, 700);
        const currentFollowers = player.followers;
        let viralRoll = Math.random();
        if (postVibe === "Unfiltered Rant" || postVibe === "Hot Take (Risky / Viral)") viralRoll += 0.25;

        const isViral = viralRoll > 0.85;
        let gainedFollowers = 0;
        let generatedLikes = 0;

        if (currentFollowers < 150) {
          generatedLikes = Math.floor(Math.random() * (currentFollowers + 1) * 0.7) + 2;
          gainedFollowers = isViral ? Math.floor(Math.random() * 80) + 15 : Math.floor(Math.random() * 3);
        } else if (currentFollowers < 2500) {
          generatedLikes = Math.floor(currentFollowers * (0.15 + Math.random() * 0.25));
          gainedFollowers = isViral ? Math.floor(Math.random() * 450) + 80 : Math.floor(Math.random() * 12);
        } else {
          generatedLikes = Math.floor(currentFollowers * (0.08 + Math.random() * 0.2));
          gainedFollowers = isViral ? Math.floor(Math.random() * 3000) + 500 : Math.floor(Math.random() * 50);
        }

        const generatedComments = [];
        if (currentFollowers < 150 && !isViral) {
          generatedComments.push(
            { id: "cm_u1", user: "mayac", text: "okkk fit check?? where was my invite", likes: 2 },
            { id: "cm_u2", user: "alexrivers", text: "hard 🔥", likes: 1 }
          );
        } else if (isViral) {
          generatedComments.push(
            { id: "cm_v1", user: "random_lurker_42", text: "why is this on my explore page lmao", likes: 142 },
            { id: "cm_v2", user: "trey_iron", text: "actually valid ngl", likes: 89 },
            { id: "cm_v3", user: "hater_patrol", text: "bro thought he did something here 💀", likes: 34 }
          );
        } else {
          generatedComments.push(
            { id: "cm_g1", user: "alexrivers", text: "bro is glowing up", likes: 8 },
            { id: "cm_g2", user: "mayac", text: "drop the location right now", likes: 5 }
          );
        }

        const newPost = {
          id: "p_u_" + Date.now(),
          image: finalImg,
          caption: postCaption,
          likes: generatedLikes,
          likedByPlayer: false,
          vibe: postVibe,
          timestamp: "Just now",
          comments: generatedComments,
          author: {
            name: player.name,
            handle: player.handle,
            avatar: player.avatar,
            verified: player.fameScore > 50000
          }
        };

        let updatedLore = player.publicLore;
        if (isViral) {
          updatedLore = `Trending after a viral ${postVibe.toLowerCase()} post. Strangers in the comments are debating their vibe.`;
        } else if (player.posts.length > 2) {
          updatedLore = `Actively building presence around ${player.aspirations}. Consistent engagement.`;
        }

        setPlayer(prev => ({
          ...prev,
          followers: prev.followers + gainedFollowers,
          fameScore: prev.fameScore + (isViral ? 200 : 25),
          publicLore: updatedLore,
          posts: [newPost, ...prev.posts]
        }));

        setFeed(prev => [newPost, ...prev]);
        setPostCaption("");
        setPostImageUrl("");
        setPostAiPrompt("");
        setActiveTab("feed");
      };

      // Multi-Key Failover DM Sender
      const handleSendDm = async (targetNpc) => {
        if (!dmMessage.trim() || isSendingDm) return;

        const userMsgText = dmMessage;
        const userMsg = {
          id: "dm_u_" + Date.now(),
          sender: "user",
          text: userMsgText,
          timestamp: "Just now"
        };

        const updatedHistory = [...(dms[targetNpc.handle] || []), userMsg];
        setDms(prev => ({ ...prev, [targetNpc.handle]: updatedHistory }));
        setDmMessage("");
        setIsSendingDm(true);

        let aiGeneratedResponse = null;

        if (apiKeys.length > 0) {
          for (let i = 0; i < apiKeys.length; i++) {
            const currentKey = apiKeys[i].trim();
            try {
              const systemPrompt = `You are ${targetNpc.name} (@${targetNpc.handle}) in an unfiltered Instagram simulator. Bio: "${targetNpc.bio}". Relationship: "${targetNpc.relationship}". Personality: "${targetNpc.disposition}". You are texting back via Instagram DMs. Respond in authentic internet texting, lowercase often, under 25 words. Don't be robotic.`;

              const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${currentKey}`,
                  "Content-Type": "application/json",
                  "HTTP-Referer": window.location.origin,
                  "X-Title": "Status Sim"
                },
                body: JSON.stringify({
                  model: "openrouter/free",
                  messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: userMsgText }
                  ]
                })
              });

              if (res.ok) {
                const data = await res.json();
                const reply = data.choices[0]?.message?.content?.trim();
                if (reply) {
                  aiGeneratedResponse = reply;
                  break;
                }
              }
            } catch (err) {
              console.warn(`Key #${i + 1} failed, rolling to next...`);
            }
          }
        }

        if (aiGeneratedResponse) {
          setDms(prev => ({
            ...prev,
            [targetNpc.handle]: [
              ...(prev[targetNpc.handle] || []),
              {
                id: "dm_npc_" + Date.now(),
                sender: "npc",
                text: aiGeneratedResponse,
                timestamp: "Just now"
              }
            ]
          }));
          setIsSendingDm(false);
          return;
        }

        // Offline Heuristic Fallback
        setTimeout(() => {
          let replyText = "Seen";
          if (targetNpc.verified && player.followers < 10000) {
            setIsSendingDm(false);
            return;
          }

          if (targetNpc.category === "mutual") {
            const pool = ["hahaha no way", "lmao are you fr?", "we need to link up soon", "dude literally 😭", "nah that's crazy"];
            replyText = pool[Math.floor(Math.random() * pool.length)];
          } else if (targetNpc.category === "gym") {
            replyText = "Heavy sets cure everything bro. Lock in.";
          } else {
            replyText = "appreciate the support! keep creating ⚡";
          }

          setDms(prev => ({
            ...prev,
            [targetNpc.handle]: [
              ...(prev[targetNpc.handle] || []),
              {
                id: "dm_npc_" + Date.now(),
                sender: "npc",
                text: replyText,
                timestamp: "Just now"
              }
            ]
          }));
          setIsSendingDm(false);
        }, 1000);
      };

      const handleCreateNewSlot = () => {
        const slotKey = "slot_" + Date.now();
        const slotTitle = prompt("Enter a name for this save slot:") || "New Arc";
        const newSaves = {
          ...saves,
          [slotKey]: {
            name: slotTitle,
            created: new Date().toLocaleDateString(),
            gameState: null
          }
        };
        setSaves(newSaves);
        setActiveSlot(slotKey);
        localStorage.setItem("status_sim_multi_saves", JSON.stringify(newSaves));
      };

      const handleExportSave = () => {
        const exportBundle = { saves, keys: apiKeys };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportBundle));
        const a = document.createElement("a");
        a.href = dataStr;
        a.download = `status_sim_sync_${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      const handleImportSave = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              if (imported.saves) {
                setSaves(imported.saves);
                localStorage.setItem("status_sim_multi_saves", JSON.stringify(imported.saves));
                setActiveSlot(Object.keys(imported.saves)[0]);
              }
              if (imported.keys) {
                setApiKeys(imported.keys);
                localStorage.setItem("status_sim_keys_pool", JSON.stringify(imported.keys));
              }
              alert("Game progress and stacked API keys imported successfully!");
            } catch (err) {
              alert("Invalid JSON sync file.");
            }
          };
          reader.readAsText(file);
        }
      };

      // Open inspection of any user
      const handleOpenUserProfile = (user) => {
        setInspectedUser(user);
        setInspectedPost(null);
      };

      // ONBOARDING
      if (!player) {
        return (
          <div className="min-h-screen bg-zinc-950 flex flex-col justify-center items-center p-4">
            <div className="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl space-y-6">
              
              <div className="text-center space-y-1">
                <span className="text-xs font-bold tracking-widest text-pink-500 uppercase">Status RPG</span>
                <h1 className="text-2xl font-black tracking-tight text-white">Create Your Social Persona</h1>
                <p className="text-xs text-zinc-400">Start with 0 followers. Shape your rep with every move.</p>
              </div>

              {onboardingStep === 1 && (
                <div className="space-y-4">
                  <div>
                    <label className="text-xs font-medium text-zinc-300">Display Name</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Jordan Rivers"
                      value={formName}
                      onChange={e => setFormName(e.target.value)}
                      className="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-pink-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-medium text-zinc-300">Username (@handle)</label>
                    <div className="flex items-center mt-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3">
                      <span className="text-zinc-500 text-sm">@</span>
                      <input 
                        type="text" 
                        placeholder="jordanrivers"
                        value={formHandle}
                        onChange={e => setFormHandle(e.target.value)}
                        className="w-full bg-transparent p-2.5 text-sm text-white focus:outline-none"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-medium text-zinc-300">Age</label>
                      <input 
                        type="number" 
                        value={formAge}
                        onChange={e => setFormAge(e.target.value)}
                        className="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-pink-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-medium text-zinc-300">School / Workplace</label>
                      <input 
                        type="text" 
                        placeholder="e.g. Ohio State, Gym"
                        value={formSchoolWork}
                        onChange={e => setFormSchoolWork(e.target.value)}
                        className="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-pink-500"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-medium text-zinc-300">Bio</label>
                    <textarea 
                      placeholder="e.g. sample flips & late night tempo runs 📻"
                      value={formBio}
                      onChange={e => setFormBio(e.target.value)}
                      className="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-pink-500 h-20 resize-none"
                    />
                  </div>
                  <button 
                    onClick={() => setOnboardingStep(2)}
                    className="w-full py-3 bg-pink-600 hover:bg-pink-500 text-white font-semibold rounded-xl text-sm transition"
                  >
                    Next: Avatar & Goals →
                  </button>
                </div>
              )}

              {onboardingStep === 2 && (
                <div className="space-y-4">
                  <div>
                    <label className="text-xs font-medium text-zinc-300">Public Goal ("The Steering Goal")</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Aspiring Producer, Powerlifter"
                      value={formAspirations}
                      onChange={e => setFormAspirations(e.target.value)}
                      className="w-full mt-1 bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-pink-500"
                    />
                  </div>

                  <div className="space-y-2">
                    <label className="text-xs font-medium text-zinc-300">Profile Picture Method</label>
                    <div className="grid grid-cols-3 gap-2">
                      <button 
                        onClick={() => setAvatarMethod("ai")}
                        className={`py-2 text-xs font-medium rounded-lg border ${avatarMethod === 'ai' ? 'bg-zinc-800 border-pink-500 text-white' : 'border-zinc-800 text-zinc-400'}`}
                      >
                        AI Generate
                      </button>
                      <button 
                        onClick={() => setAvatarMethod("upload")}
                        className={`py-2 text-xs font-medium rounded-lg border ${avatarMethod === 'upload' ? 'bg-zinc-800 border-pink-500 text-white' : 'border-zinc-800 text-zinc-400'}`}
                      >
                        Upload File
                      </button>
                      <button 
                        onClick={() => setAvatarMethod("url")}
                        className={`py-2 text-xs font-medium rounded-lg border ${avatarMethod === 'url' ? 'bg-zinc-800 border-pink-500 text-white' : 'border-zinc-800 text-zinc-400'}`}
                      >
                        Image Link
                      </button>
                    </div>
                  </div>

                  {avatarMethod === "ai" && (
                    <div className="space-y-2">
                      <textarea 
                        value={avatarPrompt}
                        onChange={e => setAvatarPrompt(e.target.value)}
                        placeholder="Describe your look (e.g. 20yo guy aesthetic 35mm film grain portrait)"
                        className="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-pink-500 h-16 resize-none"
                      />
                      <button 
                        onClick={handleGenerateAiAvatar}
                        disabled={isGeneratingAvatar}
                        className="w-full py-2 bg-zinc-800 hover:bg-zinc-700 text-xs text-pink-400 font-semibold rounded-lg border border-pink-500/30 transition"
                      >
                        {isGeneratingAvatar ? "Dreaming avatar..." : "✨ Generate Avatar"}
                      </button>
                    </div>
                  )}

                  {avatarMethod === "upload" && (
                    <div className="border border-dashed border-zinc-800 rounded-lg p-4 text-center">
                      <input 
                        type="file" 
                        accept="image/*"
                        onChange={e => handleFileUpload(e, setAvatarUrl)}
                        className="text-xs text-zinc-400 file:mr-2 file:py-1 file:px-3 file:rounded-md file:border-0 file:bg-zinc-800 file:text-white"
                      />
                    </div>
                  )}

                  {avatarMethod === "url" && (
                    <input 
                      type="text" 
                      placeholder="Paste direct https:// image URL"
                      value={avatarUrl}
                      onChange={e => setAvatarUrl(e.target.value)}
                      className="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-pink-500"
                    />
                  )}

                  {avatarUrl && (
                    <div className="flex items-center gap-3 p-2 bg-zinc-950 rounded-xl border border-zinc-800">
                      <img src={avatarUrl} alt="Preview" className="w-14 h-14 rounded-full object-cover border border-pink-500" />
                      <div>
                        <div className="text-xs font-semibold text-white">Avatar Loaded</div>
                        <div className="text-[10px] text-zinc-500">Ready to launch.</div>
                      </div>
                    </div>
                  )}

                  <div className="flex gap-2 pt-2">
                    <button onClick={() => setOnboardingStep(1)} className="py-3 px-4 bg-zinc-800 text-zinc-300 font-semibold rounded-xl text-sm">Back</button>
                    <button onClick={handleCompleteOnboarding} className="flex-1 py-3 bg-pink-600 hover:bg-pink-500 text-white font-semibold rounded-xl text-sm transition">
                      Launch Profile & Find Mutuals →
                    </button>
                  </div>
                </div>
              )}

            </div>
          </div>
        );
      }

      // ONBOARDING STEP 3 (SUGGESTED FOLLOWS)
      if (onboardingStep === 3) {
        return (
          <div className="min-h-screen bg-zinc-950 flex flex-col justify-center items-center p-4">
            <div className="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl space-y-5">
              <div className="text-center space-y-1">
                <span className="text-xs font-bold tracking-widest text-pink-500 uppercase">Suggested For You</span>
                <h2 className="text-xl font-bold text-white">People You May Know</h2>
                <p className="text-xs text-zinc-400">Based on {player.schoolWork} and your demographic.</p>
              </div>

              <div className="space-y-3">
                {suggestedFollows.map(user => {
                  const isFollowing = player.followingList?.includes(user.id);
                  return (
                    <div key={user.id} className="flex items-center justify-between p-3 bg-zinc-950 rounded-xl border border-zinc-800/80">
                      <div className="flex items-center gap-3">
                        <img src={user.avatar} className="w-11 h-11 rounded-full object-cover border border-zinc-800" />
                        <div>
                          <div className="text-sm font-semibold text-white flex items-center gap-1">
                            {user.name}
                            {user.verified && <span className="text-blue-400 text-xs">✓</span>}
                          </div>
                          <div className="text-[11px] text-zinc-500">@{user.handle}</div>
                          <div className="text-[10px] text-pink-400/90 font-medium">{user.mutualBadge}</div>
                        </div>
                      </div>
                      <button 
                        onClick={() => handleFollow(user)}
                        className={`text-xs px-3.5 py-1.5 rounded-lg font-medium transition ${isFollowing ? 'bg-zinc-800 text-zinc-300' : 'bg-pink-600 hover:bg-pink-500 text-white'}`}
                      >
                        {isFollowing ? "Following" : "Follow"}
                      </button>
                    </div>
                  );
                })}
              </div>

              <button 
                onClick={() => setOnboardingStep(0)}
                className="w-full py-3 bg-zinc-100 hover:bg-white text-zinc-950 font-bold rounded-xl text-sm transition"
              >
                Go to Feed ({player.following} Following) →
              </button>
            </div>
          </div>
        );
      }

      // MAIN APP SHELL
      return (
        <div className="min-h-screen bg-black text-zinc-100 flex justify-center">
          <div className="w-full max-w-md bg-zinc-950 border-x border-zinc-800/60 min-h-screen flex flex-col pb-20">

            {/* HEADER */}
            <header className="sticky top-0 z-40 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/60 px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-lg font-black tracking-tighter bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent cursor-pointer" onClick={() => { setInspectedUser(null); setInspectedPost(null); setActiveTab("feed"); }}>
                  STATUS
                </span>
                <span className="text-[10px] font-mono uppercase bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-400">
                  {saves[activeSlot]?.name || "Slot"}
                </span>
                {apiKeys.length > 0 && (
                  <span className="text-[9px] bg-green-500/20 text-green-400 border border-green-500/30 px-1.5 py-0.5 rounded font-mono">
                    {apiKeys.length} Keys
                  </span>
                )}
              </div>
              <button onClick={() => setShowSettings(!showSettings)} className="text-zinc-400 hover:text-white p-1">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              </button>
            </header>

            {/* SETTINGS / KEYS DRAWER */}
            {showSettings && (
              <div className="bg-zinc-900 border-b border-zinc-800 p-4 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-xs font-bold text-white uppercase tracking-wider">Save Slots & Stacked Keys</h3>
                  <button onClick={() => setShowSettings(false)} className="text-xs text-zinc-400">✕</button>
                </div>
                
                {/* Save Slots */}
                <div className="space-y-2">
                  <label className="text-xs text-zinc-400">Active Game Slot:</label>
                  <div className="grid grid-cols-2 gap-2">
                    {Object.keys(saves).map(slotKey => (
                      <button 
                        key={slotKey}
                        onClick={() => setActiveSlot(slotKey)}
                        className={`p-2 text-left rounded-lg text-xs border ${activeSlot === slotKey ? 'border-pink-500 bg-pink-500/10 text-white' : 'border-zinc-800 bg-zinc-950 text-zinc-400'}`}
                      >
                        <div className="font-semibold truncate">{saves[slotKey].name}</div>
                        <div className="text-[10px] text-zinc-500">{saves[slotKey].created}</div>
                      </button>
                    ))}
                  </div>
                  <div className="flex gap-2 pt-1">
                    <button onClick={handleCreateNewSlot} className="flex-1 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-xs text-white rounded">+ New Slot</button>
                    <button onClick={handleExportSave} className="py-1.5 px-3 bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-300 rounded">Export All</button>
                    <label className="py-1.5 px-3 bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-300 rounded cursor-pointer">
                      Import <input type="file" accept=".json" onChange={handleImportSave} className="hidden" />
                    </label>
                  </div>
                </div>

                {/* Single-Key Stacking Box */}
                <div className="pt-2 border-t border-zinc-800 space-y-2">
                  <label className="text-xs text-zinc-400 font-semibold">Stack API Keys (No Commas Needed)</label>
                  <div className="flex gap-2">
                    <input 
                      type="password"
                      placeholder="Paste single key here (sk-or-v1-...)"
                      value={newKeyInput}
                      onChange={e => setNewKeyInput(e.target.value)}
                      className="flex-1 bg-zinc-950 border border-zinc-800 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-pink-500"
                    />
                    <button onClick={handleAddKey} className="px-3 bg-pink-600 hover:bg-pink-500 text-xs font-bold rounded text-white">
                      Add Key
                    </button>
                  </div>

                  <div className="space-y-1 pt-1">
                    {apiKeys.length === 0 ? (
                      <div className="text-[11px] text-zinc-500 italic">No keys stacked. Using offline dialogue mode.</div>
                    ) : (
                      apiKeys.map((k, index) => (
                        <div key={index} className="flex items-center justify-between bg-zinc-950 px-2.5 py-1.5 rounded border border-zinc-800 text-[11px]">
                          <span className="font-mono text-zinc-300 truncate max-w-[240px]">
                            Key #{index + 1}: {k.slice(0, 10)}...{k.slice(-4)}
                          </span>
                          <button onClick={() => handleRemoveKey(index)} className="text-red-400 hover:text-red-300 font-bold ml-2">✕</button>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB CONTENT OR INSPECTOR */}
            <main className="flex-1">

              {/* POST INSPECTION MODAL */}
              {inspectedPost ? (
                <div className="p-3 space-y-3">
                  <button onClick={() => setInspectedPost(null)} className="text-xs font-bold text-zinc-400 hover:text-white flex items-center gap-1">
                    ← Back
                  </button>

                  <div className="bg-zinc-950 border border-zinc-900 rounded-xl overflow-hidden pb-4">
                    <div className="flex items-center gap-2.5 p-3">
                      <img src={inspectedPost.author.avatar} className="w-8 h-8 rounded-full object-cover cursor-pointer" onClick={() => handleOpenUserProfile(inspectedPost.author)} />
                      <div>
                        <div className="text-xs font-bold text-white flex items-center gap-1 cursor-pointer" onClick={() => handleOpenUserProfile(inspectedPost.author)}>
                          {inspectedPost.author.name}
                          {inspectedPost.author.verified && <span className="text-blue-400 text-[10px]">✓</span>}
                        </div>
                        <div className="text-[10px] text-zinc-500">@{inspectedPost.author.handle}</div>
                      </div>
                    </div>

                    <img src={inspectedPost.image} className="w-full aspect-square object-cover" />

                    <div className="p-3 space-y-2">
                      <div className="flex items-center gap-4">
                        <button onClick={() => handleToggleLike(inspectedPost)} className={`transition ${inspectedPost.likedByPlayer ? 'text-red-500' : 'text-zinc-300'}`}>
                          <svg className="w-6 h-6" fill={inspectedPost.likedByPlayer ? "currentColor" : "none"} stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </button>
                      </div>

                      <div className="text-xs font-bold text-white">{inspectedPost.likes.toLocaleString()} likes</div>
                      <p className="text-xs">
                        <span className="font-bold text-white mr-1.5">{inspectedPost.author.handle}</span>
                        <span className="text-zinc-300">{inspectedPost.caption}</span>
                      </p>

                      {/* Comments Section */}
                      <div className="border-t border-zinc-900 pt-2 space-y-2">
                        <div className="text-xs font-bold text-zinc-400">Comments</div>
                        {(!inspectedPost.comments || inspectedPost.comments.length === 0) ? (
                          <div className="text-xs text-zinc-600 italic">No comments yet. Be the first!</div>
                        ) : (
                          inspectedPost.comments.map((c, i) => (
                            <div key={c.id || i} className="text-xs flex items-center justify-between">
                              <div>
                                <span className="font-bold text-white mr-1.5">{c.user}</span>
                                <span className="text-zinc-300">{c.text}</span>
                              </div>
                              <span className="text-[10px] text-zinc-500">♡ {c.likes || 0}</span>
                            </div>
                          ))
                        )}
                      </div>

                      {/* Comment Input */}
                      <div className="flex gap-2 pt-2 border-t border-zinc-900">
                        <input 
                          type="text" 
                          placeholder="Add a comment..."
                          value={postCommentInput}
                          onChange={e => setPostCommentInput(e.target.value)}
                          onKeyDown={e => e.key === 'Enter' && handleAddComment(inspectedPost)}
                          className="flex-1 bg-zinc-900 border border-zinc-800 rounded-full px-3 py-1.5 text-xs text-white focus:outline-none focus:border-pink-500"
                        />
                        <button onClick={() => handleAddComment(inspectedPost)} className="px-3 bg-pink-600 text-xs font-bold text-white rounded-full">
                          Post
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              ) : inspectedUser ? (

              </button>

              <button onClick={() => { setInspectedUser(null); setInspectedPost(null); setActiveTab("discover"); }} className={`flex flex-col items-center ${activeTab === 'discover' ? 'text-pink-500' : 'text-zinc-500'}`}>
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
              </button>

              <button onClick={() => { setInspectedUser(null); setInspectedPost(null); setActiveTab("create"); }} className="flex items-center justify-center w-10 h-10 rounded-full bg-pink-600 hover:bg-pink-500 text-white shadow-lg shadow-pink-600/30">
                <span className="text-xl font-bold leading-none mb-0.5">+</span>
              </button>

              <button onClick={() => { setInspectedUser(null); setInspectedPost(null); setActiveDmUser(null); setActiveTab("dms"); }} className={`flex flex-col items-center ${activeTab === 'dms' ? 'text-pink-500' : 'text-zinc-500'}`}>
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
              </button>

              <button onClick={() => { setInspectedUser(null); setInspectedPost(null); setActiveTab("profile"); }} className={`flex flex-col items-center ${activeTab === 'profile' && !inspectedUser && !inspectedPost ? 'text-pink-500' : 'text-zinc-500'}`}>
                <img src={player.avatar} className={`w-6 h-6 rounded-full object-cover border ${activeTab === 'profile' && !inspectedUser && !inspectedPost ? 'border-pink-500' : 'border-zinc-700'}`} />
              </button>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
